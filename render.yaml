services:
  - type: web
    name: bagua-mingpan
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    # 单进程多线程：SQLite 单文件，多 worker 并发写会锁库
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # 公开部署：锁死配置接口 + AI 限流；AI 走「访客自带 Key」，站长不用填 Key
      - key: PUBLIC_MODE
        value: "1"
      - key: AI_RATE_LIMIT
        value: "5"
      - key: AI_RATE_WINDOW
        value: "600"
